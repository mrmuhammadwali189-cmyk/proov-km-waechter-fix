# settings.cfg — Vossberg Mobility, KM-Waechter
# Wartungsregeln. Nicht ohne Freigabe von Fleet Ops aendern!
# (Maintenance rules. Do not change without sign-off from Fleet Ops!)
#
# NOTE (2016): km_wachter.py carries its own copies of the two rule values below.
# Nobody remembers which one wins. Keep them identical, always.

service_interval_km = 15000
warn_at_percent = 80

report_title = "Vossberg Mobility - nightly fleet report"
history_file = fleet_history.csv

[output]
# Path is relative to the working directory of the process.
log_file = km_wachter.log

# Accepted values: km | mi
# Must match the unit stored in fleet_history.csv.
mileage_unit = km
